<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>

  <!-- Link to the external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main container to keep everything centered and organized -->
  <div class="app-container">

    <!-- App Header -->
    <header class="app-header">
      <h1>🎓 Student Expense Tracker</h1>
      <p>Keep track of your pocket money and college expenses</p>
    </header>

    <!-- Summary Section: Displays the total amount spent -->
    <section class="summary-card">
      <h2>Total Spent</h2>
      <!-- The amount inside this span will be updated dynamically via JavaScript -->
      <p class="total-display">₹<span id="total-amount">0</span></p>
    </section>

    <!-- Form Section: Allows the student to input a new expense -->
    <section class="form-card">
      <h2>Add New Expense</h2>
      <form id="expense-form">

        <!-- Expense Name Input -->
        <div class="form-group">
          <label for="expense-name">Expense Name</label>
          <input 
            type="text" 
            id="expense-name" 
            placeholder="e.g., Canteen samosa, Xerox copies" 
            required
          >
        </div>

        <!-- Amount Input (in Rupees) -->
        <div class="form-group">
          <label for="expense-amount">Amount (₹)</label>
          <input 
            type="number" 
            id="expense-amount" 
            placeholder="e.g., 50" 
            min="1" 
            step="any" 
            required
          >
        </div>

        <!-- Category Dropdown -->
        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" required>
            <option value="" disabled selected>Select category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Books">Books</option>
            <option value="Fun">Fun</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Date Input -->
        <div class="form-group">
          <label for="expense-date">Date</label>
          <input 
            type="date" 
            id="expense-date" 
            required
          >
        </div>

        <!-- Submit Button -->
        <button type="submit" id="add-btn">Add Expense</button>
      </form>
    </section>

    <!-- Expense List Section: Where submitted expenses will be added -->
    <section class="list-card">
      <h2>Recent Expenses</h2>
      <!-- Empty list where JavaScript will insert <li> items for each expense -->
      <ul id="expense-list"></ul>
    </section>

  </div>

  <!-- Link to the external JavaScript file (loaded at the end of body) -->
  <script src="script.js"></script>
</body>
</html>
